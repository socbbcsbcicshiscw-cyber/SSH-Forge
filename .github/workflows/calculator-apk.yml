name: Calculator APK

on:
  push:
    paths:
      - "simple-calculator/**"
      - ".github/workflows/calculator-apk.yml"
  pull_request:
    paths:
      - "simple-calculator/**"
      - ".github/workflows/calculator-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Simple Calculator APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -e
          VERSION_NAME=$(grep -E '^VERSION_NAME=' simple-calculator/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          VERSION_CODE=$(grep -E '^VERSION_CODE=' simple-calculator/gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          test -n "$VERSION_NAME"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk_name=simple_calculator_v${VERSION_NAME}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=calculator-v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION_NAME ($VERSION_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-37" 2>&1 | tail -5

      - name: Build release APK (unsigned)
        id: release
        continue-on-error: true
        working-directory: simple-calculator
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug APK (fallback / verification)
        working-directory: simple-calculator
        env:
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Sign and collect the installable APK
        id: apk
        env:
          APK_ASSET_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -e
          mkdir -p dist
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "Using build tools: $BUILD_TOOLS"
          UNSIGNED=""
          for candidate in \
            simple-calculator/app/build/outputs/apk/release/app-release-unsigned.apk \
            simple-calculator/app/build/outputs/apk/release/app-release.apk
          do
            if [ -f "$candidate" ]; then UNSIGNED="$candidate"; break; fi
          done

          if [ -n "$UNSIGNED" ]; then
            echo "Signing $UNSIGNED"
            keytool -genkeypair -v -keystore ci-release.keystore -storepass arena-ci-pass \
              -keypass arena-ci-pass -alias ci -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Simple Calculator CI, O=Local Build, C=UA" > /dev/null 2>&1
            "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" /tmp/aligned.apk
            "$BUILD_TOOLS/apksigner" sign --v4-signing-enabled false --ks ci-release.keystore \
              --ks-pass pass:arena-ci-pass --key-pass pass:arena-ci-pass \
              --out "dist/${APK_ASSET_NAME}" /tmp/aligned.apk
            "$BUILD_TOOLS/apksigner" verify --print-certs "dist/${APK_ASSET_NAME}"
            SOURCE="release (signed)"
          else
            echo "Release build unavailable, falling back to the debug APK"
            cp simple-calculator/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_ASSET_NAME}"
            SOURCE="debug"
          fi

          sha256sum "dist/${APK_ASSET_NAME}" | tee "dist/${APK_ASSET_NAME}.sha256"
          ls -l dist
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-calculator-apk-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release with the APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          APK_ASSET_NAME: ${{ steps.version.outputs.apk_name }}
          VERSION_NAME: ${{ steps.version.outputs.version }}
        run: |
          set -e
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          cat > /tmp/release-notes.md <<NOTES
          Installable APK of **Simple Calculator ${VERSION_NAME}**, built in GitHub Actions from
          [\`simple-calculator/\`](https://github.com/${GITHUB_REPOSITORY}/tree/main/simple-calculator) —
          this repository's build of
          [hobby-projects-lab/simple-calculator](https://github.com/hobby-projects-lab/simple-calculator)
          with the improvements listed in
          [\`MODIFICATIONS.md\`](https://github.com/${GITHUB_REPOSITORY}/blob/main/simple-calculator/MODIFICATIONS.md).

          * App ID: \`hpl.apps.android.math\`
          * Version: ${VERSION_NAME}
          * Min Android: 7.0 (API 24)
          * License: GPL-3.0 — original copyright and licence kept unchanged
          * Signing: fresh CI key (not the upstream author's key), so uninstall the upstream
            build first if you have it installed

          Download the \`.apk\` below and open it on your phone to install
          (Android will ask you to allow installs from your browser or file manager).
          The \`.sha256\` file next to the APK lets you verify the download.
          NOTES
          gh release create "$RELEASE_TAG" dist/* \
            -R "$GITHUB_REPOSITORY" \
            --title "Simple Calculator ${VERSION_NAME} — APK" \
            --notes-file /tmp/release-notes.md
