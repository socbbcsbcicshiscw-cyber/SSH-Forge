name: Android build

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4.0.4

      - name: Install project Android SDK components
        shell: bash
        run: |
          set +e
          sdkmanager "platforms;android-37" "build-tools;36.0.0" 2>&1 | tee "$RUNNER_TEMP/sdkmanager-install.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$( (grep -Ei 'error|failed|exception|not found|unknown' "$RUNNER_TEMP/sdkmanager-install.log" || true) | tail -n 8 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Android SDK installation failed::sdkmanager exited with status ${status}. ${details}"
            exit "$status"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ssh-forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
