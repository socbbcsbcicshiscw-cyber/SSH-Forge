name: Android build

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_debug:
        description: Create a clearly labeled public pre-release with the debug-signed APK
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4.0.4

      - name: Install project Android SDK components
        shell: bash
        run: |
          set +e
          sdkmanager "platforms;android-36" "build-tools;36.0.0" 2>&1 | tee "$RUNNER_TEMP/sdkmanager-install.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$( (grep -Ei 'error|failed|exception|not found|unknown' "$RUNNER_TEMP/sdkmanager-install.log" || true) | tail -n 8 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Android SDK installation failed::sdkmanager exited with status ${status}. ${details}"
            exit "$status"
          fi

      - name: Validate F-Droid upstream metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import struct

          metadata = Path("fastlane/metadata/android/en-US")
          title = (metadata / "title.txt").read_text(encoding="utf-8").strip()
          short_description = (metadata / "short_description.txt").read_text(encoding="utf-8").strip()
          full_description = (metadata / "full_description.txt").read_text(encoding="utf-8").strip()
          gradle = Path("app/build.gradle.kts").read_text(encoding="utf-8")
          version_code = re.search(r"versionCode = (\d+)", gradle).group(1)
          changelog_path = metadata / "changelogs" / f"{version_code}.txt"
          changelog = changelog_path.read_text(encoding="utf-8").strip()
          icon = (metadata / "images/icon.png").read_bytes()
          assert title and len(title) <= 50
          assert short_description and len(short_description) < 80 and not short_description.endswith(".")
          assert full_description and len(full_description) <= 4000
          assert changelog and len(changelog) <= 500
          assert icon[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", icon[16:24]) == (512, 512)
          print(f"Validated en-US Fastlane metadata and versionCode {version_code} changelog.")
          PY

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest 2>&1 | tee "$RUNNER_TEMP/testDebugUnitTest.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$( (grep -Ei '(^e:|error|failed|exception|what went wrong|unresolved reference|could not|not found|execution failed|task :.*failed)' "$RUNNER_TEMP/testDebugUnitTest.log" || true) | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Gradle unit tests failed::./gradlew testDebugUnitTest exited with status ${status}. ${details}"
            exit "$status"
          fi

      - name: Repeat clean unsigned release build for reproducibility
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean assembleRelease
          release_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$release_apk"
          cp "$release_apk" "$RUNNER_TEMP/ssh-forge-release-first.apk"
          ./gradlew clean assembleRelease
          cmp --silent "$RUNNER_TEMP/ssh-forge-release-first.apk" "$release_apk" || {
            echo "::error title=Release build is not reproducible::The two clean unsigned release APKs differ."
            exit 1
          }
          echo "Two clean unsigned release builds were byte-identical (SHA-256: $(sha256sum "$release_apk" | cut -d' ' -f1))." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug 2>&1 | tee "$RUNNER_TEMP/assembleDebug.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            details=$( (grep -Ei '(^e:|error|failed|exception|what went wrong|unresolved reference|could not|not found|execution failed|task :.*failed)' "$RUNNER_TEMP/assembleDebug.log" || true) | tail -n 12 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Gradle APK build failed::./gradlew assembleDebug exited with status ${status}. ${details}"
            exit "$status"
          fi

      - name: Verify debug APK package, SDK levels, size and signature
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "::error title=Unexpected APK count::Expected exactly one debug APK; found ${#apks[@]}."
            exit 1
          fi
          apk="${apks[0]}"
          if [[ ! -s "$apk" ]]; then
            echo "::error title=Debug APK is empty::The APK file is missing or has zero size."
            exit 1
          fi
          expected_id=$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          expected_min=$(sed -nE 's/^[[:space:]]*minSdk = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          expected_target=$(sed -nE 's/^[[:space:]]*targetSdk = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          expected_code=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          expected_name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          actual_id=$(apkanalyzer manifest application-id "$apk")
          actual_min=$(apkanalyzer manifest min-sdk "$apk")
          actual_target=$(apkanalyzer manifest target-sdk "$apk")
          actual_code=$(apkanalyzer manifest version-code "$apk")
          actual_name=$(apkanalyzer manifest version-name "$apk")
          [[ "$actual_id" == "$expected_id" ]] || { echo "::error::APK applicationId mismatch: $actual_id"; exit 1; }
          [[ "$actual_min" == "$expected_min" ]] || { echo "::error::APK minSdk mismatch: $actual_min"; exit 1; }
          [[ "$actual_target" == "$expected_target" ]] || { echo "::error::APK targetSdk mismatch: $actual_target"; exit 1; }
          [[ "$actual_code" == "$expected_code" ]] || { echo "::error::APK versionCode mismatch: $actual_code"; exit 1; }
          [[ "$actual_name" == "$expected_name" ]] || { echo "::error::APK versionName mismatch: $actual_name"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" 2>&1 | tee "$RUNNER_TEMP/apksigner-verify.log"
          apk_size=$(stat -c '%s' "$apk")
          apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          printf '%s\n' \
            "APK: $apk" \
            "Size: $apk_size bytes" \
            "SHA-256: $apk_sha256" \
            "Package: $actual_id" \
            "minSdk / targetSdk: $actual_min / $actual_target" \
            "versionName / versionCode: $actual_name / $actual_code" \
            "Signature: verified with apksigner" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ssh-forge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload concept screenshots artifact
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ssh-forge-screenshots
          path: screenshots/concepts/*
          if-no-files-found: error
          retention-days: 14

  publish-debug-release:
    name: Publish public debug APK pre-release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_debug
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download tested debug APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: ssh-forge-debug-apk
          path: release-assets

      - name: Publish clearly labeled debug pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-assets -type f -name '*.apk' -print | sort)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one tested APK; found ${#apks[@]}." >&2
            exit 1
          fi
          short_sha="${GITHUB_SHA:0:7}"
          tag="debug-${short_sha}"
          asset="$RUNNER_TEMP/SSH-Forge-debug-${short_sha}.apk"
          cp "${apks[0]}" "$asset"
          checksum=$(sha256sum "$asset" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Unofficial debug/test build from commit ${GITHUB_SHA}.

          This APK is signed with the Android debug key. It is not a production release, is not signed with a release key, and is not an official Google Play or F-Droid build. Install only if you understand these limitations.

          APK SHA-256: ${checksum}
          EOF
          gh release create "$tag" "$asset#SSH-Forge debug APK" \
            --target "$GITHUB_SHA" \
            --title "SSH-Forge debug APK (${short_sha})" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
