    <g fill="#58D6A2"><circle cx="189" cy="78" r="3"/><circle cx="189" cy="97" r="3"/></g>
  </g>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="366" y="118" fill="#58D6A2" font-size="24" font-weight="700" letter-spacing="5">SSH-FORGE</text>
    <text x="362" y="207" fill="#E5EDF2" font-size="55" font-weight="700">One remote</text>
    <text x="362" y="270" fill="#58D6A2" font-size="55" font-weight="700">command at a time.</text>
    <text x="366" y="338" fill="#C3D0D9" font-size="23">Password SSH · SHA-256 host-key prompt</text>
    <text x="366" y="378" fill="#C3D0D9" font-size="23">Bounded output · Disconnect when needed</text>
    <text x="366" y="438" fill="#8A9AA8" font-size="17">A focused command client — not an interactive shell.</text>
  </g>
